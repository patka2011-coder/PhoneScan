name: Build PhoneScan APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create project
        env:
          F1: H4sIACfrq2oC/6WPvwrCMBjE9zxF6FQXH0BwEFFQrA3VvYTmiJH0+0KSCiK+u38QEQcXb/wdd9wFP1hHlSZt0YOyvAh5V0Tg5DJHh/RCD1lm61GO3qDXJ9D8novaf2AbtfFQz27FMb/Nq7gKgwAyoO7cILEfsuPfAyo2GCfksvmGy9lq09bbVjX1ejHft81C1bvRvw8eIyNzVpGP6PKYdA85lYU6MGHXaSqEo84PBrKY6BAKcQMAlIjHRgEAAA==
          F2: H4sIACfrq2oC/yvIKU3PzCtWqOZSAILMFAX15PxcvcS8lKL8zBS9xIKCnMzkxJLM/Dx1hbLUomIgQ0HdQs/QUM9QXQEkW6mQlphTnMpVywUAA1C9wUoAAAA=
          F3: H4sIACfrq2oC/0vMSynKz0zRKy1OdYQwI2xLikpTuRKhEnn5eSFFiXnFmSWZZalBzjmJxcUQBflF6XrpRYkpOal6WWW5iUXpxba6EbkVRgYmFrkKui5pmUCJ1Lzk/JTMvHTb0BA3XQsuAEkxBD1tAAAA
          F4: 
          F5: 
          F6: H4sIACfrq2oC/7MpSi3OLy1KTi2241IAApvikqLMvHSFvMTcVFulxIKCeBBLyS4gIz8vNTg5Mc9GH6LCjstGH0kvAM20ZyBIAAAA
          F7: 
        run: |
          python3 - <<'PY'
          import os,base64,gzip
          files = {
              'settings.gradle': os.environ['F1'],
              'build.gradle': os.environ['F2'],
              'gradle.properties': os.environ['F3'],
              'app/build.gradle': os.environ['F4'],
              'app/src/main/AndroidManifest.xml': os.environ['F5'],
              'app/src/main/res/values/strings.xml': os.environ['F6'],
              'app/src/main/java/hu/patka/phonescan/MainActivity.java': os.environ['F7'],
          }
          for path,data in files.items():
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path,'wb') as f:
                  f.write(gzip.decompress(base64.b64decode(data)))
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneScan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneScan-APK
          path: PhoneScan.apk
          retention-days: 30
          
