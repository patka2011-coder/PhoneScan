name: Build PhoneScan APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create project
        env:
          F1: H4sIAAn1q2oC/6WPvwrCMBjE9zxF6FQXH0BwEFFQrA3VvYTmiJH0+0KSCiK+u38QEQcXb/wdd9wFP1hHlSZt0YOyvAh5V0Tg5DJHh/RCD1lm61GO3qDXJ9D8novaf2AbtfFQz27FMb/Nq7gKgwAyoO7cILEfsuPfAyo2GCfksvmGy9lq09bbVjX1ejHft81C1bvRvw8eIyNzVpGP6PKYdA85lYU6MGHXaSqEo84PBrKY6BAKcQMAlIjHRgEAAA==
          F2: H4sIAAn1q2oC/yvIKU3PzCtWqOZSAILMFAX15PxcvcS8lKL8zBS9xIKCnMzkxJLM/Dx1hbLUomIgQ0HdQs/QUM9QXQEkW6mQlphTnMpVywUAA1C9wUoAAAA=
          F3: H4sIAAn1q2oC/0vMSynKz0zRKy1OdYQwI2xLikpTuRKhEnn5eSFFiXnFmSWZZalBzjmJxcUQBflF6XrpRYkpOal6WWW5iUXpxba6EbkVRgYmFrkKui5pmUCJ1Lzk/JTMvHTb0BA3XQsuAEkxBD1tAAAA
          F4: 
          F5: 
          F6: H4sIAAn1q2oC/7MpSi3OLy1KTi2241IAApvikqLMvHSFvMTcVFulxIKCeBBLyS4gIz8vNTg5Mc9GH6LCjstGH0kvAM20ZyBIAAAA
          F7: 
        run: |
          mkdir -p app/src/main/java/hu/patka/phonescan app/src/main/res/values
          echo "$F1" | base64 -d | gzip -d > "settings.gradle"
          echo "$F2" | base64 -d | gzip -d > "build.gradle"
          echo "$F3" | base64 -d | gzip -d > "gradle.properties"
          echo "$F4" | base64 -d | gzip -d > "app/build.gradle"
          echo "$F5" | base64 -d | gzip -d > "app/src/main/AndroidManifest.xml"
          echo "$F6" | base64 -d | gzip -d > "app/src/main/res/values/strings.xml"
          echo "$F7" | base64 -d | gzip -d > "app/src/main/java/hu/patka/phonescan/MainActivity.java"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneScan-v1.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneScan-v1.2-APK
          path: PhoneScan-v1.2.apk
          retention-days: 30
          
